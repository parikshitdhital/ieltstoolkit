<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Teacher panel</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667;--ac:#4f46e5;--ok:#16a34a;--no:#dc2626;--wa:#d97706;--bd:#e3e5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1d2030;--tx:#eef0f8;--mu:#9aa0b8;--bd:#2c3046;--ac:#8b85ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#w{max-width:620px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
input,button{font:inherit}input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:6px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}button:disabled{opacity:.35;cursor:default}.mu{color:var(--mu);font-size:14px}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}.ctl button{padding:8px 12px}.ctl .ghost,.pk button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.pk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}.pk button{padding:9px 4px}.pk .sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.wheel{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 10px;scrollbar-width:none}.wheel::-webkit-scrollbar{display:none}
.dy{flex:none;width:52px;scroll-snap-align:center;text-align:center;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:6px 0 0;overflow:hidden}.dy b{display:block;font-size:20px}.dy span{font-size:11px;color:var(--mu)}.dy i{display:block;height:5px;margin-top:5px}.dy.sel{background:var(--ac);color:#fff;border-color:var(--ac);transform:scale(1.07)}.dy.sel span{color:#e0e0ff}.dy:disabled{opacity:.3}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.mg div.h{font-size:11px;color:var(--mu);text-align:center}.mg button{padding:0;height:36px;border-radius:8px;color:var(--tx);font-weight:600;font-size:13px;border:2px solid transparent}.mg button.sel{border-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.g div{text-align:center;background:var(--bg);border-radius:10px;padding:8px}.g b{display:block;font-size:20px}.g span{font-size:12px;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.fl{background:rgba(217,119,6,.14);color:var(--wa);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:14px}
.trk{position:relative;height:20px;background:var(--bd);border-radius:10px;margin:12px 0 2px;touch-action:manipulation}.trk b{position:absolute;top:0;bottom:0;border-radius:3px}.trk .g1{background:var(--ok)}.trk .l1{background:#86efac}.trk .p1{background:rgba(22,163,74,.35)}
.now{position:absolute;top:-3px;width:14px;height:26px;border-radius:7px;background:var(--ok);transform:translateX(-50%);box-shadow:0 0 0 4px rgba(22,163,74,.3);animation:pu 1.2s ease-in-out infinite}@keyframes pu{50%{box-shadow:0 0 0 9px rgba(22,163,74,0)}}
.tkl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}.tt{font-size:13px;color:var(--mu);min-height:20px;margin-top:4px}
ul{margin:4px 0 8px;padding-left:20px}li{margin:3px 0}h3{margin:12px 0 4px;font-size:16px}details{border-top:1px solid var(--bd);padding:6px 0}summary{cursor:pointer;font-weight:600}
@keyframes sr{from{opacity:0;transform:translateX(30px)}}@keyframes sl2{from{opacity:0;transform:translateX(-30px)}}.sr{animation:sr .25s}.sl2{animation:sl2 .25s}
</style></head><body><div id="w"></div>
<script>
const W=document.getElementById('w'),esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pad=n=>String(n).padStart(2,'0'),NP=345;
let KEYV='',D=null,CHK=null,SEL='',VM='',PICK='',ANIM='';try{KEYV=sessionStorage.getItem('tk')||''}catch(e){}
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fm=s=>{s=Math.round(s/60);return s>=60?Math.floor(s/60)+'h '+(s%60)+'m':s+' min'},hm=ms=>{const d=new Date(ms+NP*60000);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())},mm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const ago=(now,t)=>{if(!t)return'never';const m=Math.round((now-t)/60000);return m<2?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate(),wdn=(y,m,d)=>new Date(Date.UTC(y,m-1,d)).getUTCDay(),ds=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const addD=(s,n)=>{const d=new Date(Date.parse(s+'T00:00:00Z')+n*864e5);return d.toISOString().slice(0,10)};
const heat=s=>s<=0?'var(--bd)':s<900?'#bbf7d0':s<2700?'#4ade80':s<5400?'#22c55e':'#15803d';
const calSum=()=>{const c={};D.students.forEach(s=>Object.keys(s.cal||{}).forEach(k=>{c[k]=(c[k]||0)+s.cal[k][0]}));return c};
const vl=v=>v&&v.length?'<ul>'+v.slice().sort((a,b)=>a.s-b.s).map(x=>'<li>'+hm(x.s)+' – '+hm(x.e)+' · <b>'+fm(x.secs)+'</b> active · '+x.qs+' questions'+(x.off?' · ⏱ synced later (was offline)':'')+'</li>').join('')+'</ul>':'<p class=mu>No visits recorded for this day.</p>';
const seg=(r,c)=>'<b class='+c+' style="left:'+(r[0]/14.4)+'%;width:'+Math.max(.2,(r[1]-r[0]+1)/14.4)+'%"></b>';
function track(day,live,now){let h='';(day.m||[]).forEach(r=>h+=seg(r,'g1'));(day.ml||[]).forEach(r=>h+=seg(r,'l1'));
if(!(day.m||[]).length&&!(day.ml||[]).length)(day.v||[]).forEach(v=>{const s=Math.floor((v.s+NP*60000)/60000)%1440,e=Math.floor((v.e+NP*60000)/60000)%1440;if(e>=s)h+=seg([s,e],'p1')});
if(live)h+='<i class=now style="left:'+((Math.floor((now+NP*60000)/60000)%1440)/14.4)+'%"></i>';
return '<div class=trk>'+h+'</div><div class=tkl><span>12 am</span><span>6 am</span><span>12 pm</span><span>6 pm</span><span>12 am</span></div><div class=tt>Tap the line to read a time.</div>'}
function login(msg){W.innerHTML='<div class=card><h2>👩‍🏫 Teacher panel</h2><p class=mu>Enter your teacher key.</p><input id=k type=password placeholder="Teacher key" autocomplete=current-password><button id=b style="width:100%">Open</button><p id=m style="color:var(--no)">'+esc(msg||'')+'</p></div>';
const go=()=>{KEYV=document.getElementById('k').value;try{sessionStorage.setItem('tk',KEYV)}catch(e){}load()};document.getElementById('b').onclick=go;document.getElementById('k').onkeydown=e=>{if(e.key=='Enter')go()}}
async function load(){try{const H={headers:{'x-teacher-key':KEYV}},q=VM?'?month='+VM:'',[r,c]=await Promise.all([fetch('/api/teacher'+q,H),fetch('/api/teacher?check=1',H).catch(()=>null)]);if(r.status==401){try{sessionStorage.removeItem('tk')}catch(e){}return login('Wrong key.')}if(!r.ok)throw 0;try{CHK=c&&c.ok?await c.json():null}catch(e){}D=await r.json();if(!SEL){SEL=D.today}if(!VM)VM=D.month;draw()}catch(e){W.innerHTML='<div class=card>Could not load the data. If this keeps failing, the database or keys are not set up in Vercel yet.<br><br><button onclick="load()">Try again</button></div>'}}
function sys(c){if(!c)return'<p class=mu>System check unavailable.</p>';const L=(ok,t)=>'<li>'+(ok?'✅':'❌')+' '+t+'</li>';return '<ul style="list-style:none;padding:0">'+L(c.env.TRACK_SECRET,'TRACK_SECRET is set')+L(c.env.APP_USERS,'APP_USERS is set ('+c.loginUsers+' student login'+(c.loginUsers==1?'':'s')+')')+L(c.env.REDIS_URL&&c.env.REDIS_TOKEN,'Database variables are set')+L(c.redis=='ok','Database connection: '+esc(c.redis))+L((c.recordedStudents||0)>0,'Students who have sent data: '+(c.recordedStudents==null?'unknown':c.recordedStudents))+'</ul>'}
function setDay(d){if(d>D.today)return;const [y,m]=d.split('-');const nv=y+'-'+m;ANIM=d>SEL?'sr':'sl2';SEL=d;PICK='';if(nv!==VM){VM=nv;load()}else draw()}
function setMonth(y,m){VM=y+'-'+pad(m);const t=D.today.split('-').map(Number);let dd=Math.min(+SEL.split('-')[2],dim(y,m));SEL=ds(y,m,dd);if(SEL>D.today)SEL=D.today;PICK='';load()}
function draw(){const cs=calSum(),keys=Object.keys(cs).sort(),first=keys[0]||D.today,[ty,tm]=D.today.split('-').map(Number),[fy,fm0]=first.split('-').map(Number),[vy,vm]=VM.split('-').map(Number);
const okM=(y,m)=>(y>fy||(y==fy&&m>=fm0))&&(y<ty||(y==ty&&m<=tm));
let h='<h2>👩‍🏫 Teacher panel</h2><p class=mu>Today (Nepal time): '+esc(D.today)+' · updates every minute · <a href=# id=r style="color:var(--ac)">refresh now</a></p>';
h+='<div class=ctl><button class=ghost id=pm '+(okM(vm==1?vy-1:vy,vm==1?12:vm-1)?'':'disabled')+'>‹</button><button class=ghost id=mc>'+MN[vm-1]+' ▾</button><button class=ghost id=yc>'+vy+' ▾</button><button class=ghost id=nm '+(okM(vm==12?vy+1:vy,vm==12?1:vm+1)?'':'disabled')+'>›</button><button id=td style="margin-left:auto">Today</button></div>';
if(PICK=='m')h+='<div class=pk>'+MN.map((n,i)=>'<button class="ghost'+(i+1==vm?' sel':'')+'" data-m='+(i+1)+' '+(okM(vy,i+1)?'':'disabled')+'>'+n.slice(0,3)+'</button>').join('')+'</div>';
if(PICK=='y'){let ys='';for(let y=fy;y<=ty;y++)ys+='<button class="ghost'+(y==vy?' sel':'')+'" data-y='+y+'>'+y+'</button>';h+='<div class=pk>'+ys+'</div>'}
const n=dim(vy,vm);let wh='';for(let d=1;d<=n;d++){const k=ds(vy,vm,d),s=cs[k]||0;wh+='<button class="dy'+(k==SEL?' sel':'')+'" data-d='+k+(k>D.today?' disabled':'')+'><span>'+WD[wdn(vy,vm,d)]+'</span><b>'+d+'</b><i style="background:'+(k==SEL?'#fff':heat(s))+'"></i></button>'}
h+='<div class=wheel id=wh>'+wh+'</div>';
let gr='';['S','M','T','W','T','F','S'].forEach(x=>gr+='<div class=h>'+x+'</div>');for(let i=0;i<wdn(vy,vm,1);i++)gr+='<div></div>';for(let d=1;d<=n;d++){const k=ds(vy,vm,d);gr+='<button data-d='+k+(k>D.today?' disabled':'')+' class="'+(k==SEL?'sel':'')+'" style="background:'+(k>D.today?'transparent':heat(cs[k]||0))+';color:'+((cs[k]||0)>=2700?'#fff':'inherit')+'">'+d+'</button>'}
h+='<details class=card><summary>Month overview (darker green = more study)</summary><div class=mg>'+gr+'</div></details>';
const sd=SEL.split('-').map(Number),isT=SEL==D.today;
h+='<div class="'+ANIM+'" id=dp><div class=ctl><button class=ghost id=pd '+(SEL<=first?'disabled':'')+'>‹</button><b style="flex:1;text-align:center">'+WD[wdn(sd[0],sd[1],sd[2])]+' '+sd[2]+' '+MN[sd[1]-1]+' '+sd[0]+(isT?' · today':'')+'</b><button class=ghost id=nd '+(isT?'disabled':'')+'>›</button></div>';
h+=D.students.length?D.students.map(s=>{const t=(s.days||{})[SEL]||{opens:0,secs:0,qs:0,rq:0,correct:0,es:0,fast:0},acc=t.qs?Math.round(100*t.correct/t.qs):null,live=isT&&D.now-s.seen<150000,on=D.now-s.seen<600000,fl=[];
const total=Object.values(s.cal||{}).reduce((a,x)=>a+x[2],0),vc=Math.max(t.opens||0,(t.v||[]).length);
if(!t.qs&&!t.secs)fl.push('No activity on this day.');if(t.secs>=1200&&t.qs<5)fl.push('Time spent ('+fm(t.secs)+') but only '+t.qs+' questions answered.');if(t.qs>=8&&t.fast/((t.qs+t.rq)||1)>.25)fl.push(t.fast+' answers were given in under 2 seconds (possible random tapping).');if(t.qs>=15&&acc<30)fl.push('Very low accuracy ('+acc+'%).');
return '<div class=card><b style="font-size:18px"><span class=dot style="background:'+(on?'var(--ok)':'var(--mu)')+'"></span>'+esc(s.u)+'</b> <span class=mu>· last seen '+ago(D.now,s.seen)+(live?' · <b style="color:var(--ok)">studying now</b>':'')+'</span>'+track(t,live,D.now)+'<div class=g><div><b>'+vc+'</b><span>Visits</span></div><div><b>'+fm(t.secs)+'</b><span>Time spent</span></div><div><b>'+t.qs+'</b><span>Questions</span></div><div><b>'+(acc==null?'–':acc+'%')+'</b><span>Correct</span></div><div><b>'+total+'</b><span>Total visits</span></div><div><b>'+t.es+'</b><span>Essays</span></div></div>'+fl.map(x=>'<div class=fl>⚠️ '+esc(x)+'</div>').join('')+'<h3>Visits</h3>'+vl(t.v)+
'<p class=mu>XP '+s.snap.xp+' · streak '+s.snap.streak+' · stars '+s.snap.stars+' · words mastered '+s.snap.words+'<br>Practice coverage (different questions answered): '+((s.snap.cov||[]).filter(c=>c[1]>0).map(c=>esc(c[0])+' '+c[1]+'/'+c[2]).join(' · ')||'none yet')+'<br>Weak spots: '+(s.snap.miss.length?s.snap.miss.map(m=>esc(m[0])+' ×'+m[1]).join(', '):'none yet')+'</p></div>'}).join(''):'<div class=card><b>No student activity recorded yet.</b><p class=mu>Common reasons: the student has not logged out and in again since the update, or a setting below is missing.</p></div>';
h+='</div><details class=card'+(D.students.length?'':' open')+'><summary>System check</summary>'+sys(CHK)+'</details><p class=mu>Green = minutes the student was active (page open and tapping or typing). Light green = reported later after being offline. Pale = approximate, from older days. Nepal time. Counts and times only; answers are never stored.</p>';
W.innerHTML=h;ANIM='';bind(okM)}
function bind(okM){const $=id=>document.getElementById(id),[vy,vm]=VM.split('-').map(Number);
$('r').onclick=e=>{e.preventDefault();load()};$('td').onclick=()=>{ANIM='sr';SEL=D.today;PICK='';const m=D.today.slice(0,7);if(m!==VM){VM=m;load()}else draw()};
$('pm').onclick=()=>{const y=vm==1?vy-1:vy,m=vm==1?12:vm-1;setMonth(y,m)};$('nm').onclick=()=>{const y=vm==12?vy+1:vy,m=vm==12?1:vm+1;setMonth(y,m)};
$('mc').onclick=()=>{PICK=PICK=='m'?'':'m';draw()};$('yc').onclick=()=>{PICK=PICK=='y'?'':'y';draw()};
W.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMonth(vy,+b.dataset.m));W.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{const y=+b.dataset.y;let m=vm;while(!okM(y,m))m+=y>vy?1:-1;setMonth(y,m)});
W.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setDay(b.dataset.d));
$('pd').onclick=()=>setDay(addD(SEL,-1));$('nd').onclick=()=>setDay(addD(SEL,1));
const sel=W.querySelector('.dy.sel');if(sel)sel.scrollIntoView({inline:'center',block:'nearest'});
const dp=$('dp');let x0=0,y0=0;dp.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});dp.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>70&&Math.abs(dy)<50){dx<0?setDay(addD(SEL,1)):setDay(addD(SEL,-1))}},{passive:true});
W.querySelectorAll('.trk').forEach(t=>t.onclick=e=>{const r=t.getBoundingClientRect(),p=Math.max(0,Math.min(1439,Math.floor((e.clientX-r.left)/r.width*1440))),on=[...t.querySelectorAll('b')].some(b=>{const l=parseFloat(b.style.left)*14.4,w=parseFloat(b.style.width)*14.4;return p>=l-.01&&p<=l+w});t.parentNode.querySelector('.tt').textContent=mm(p)+(on?' · active':' · not active')})}
if(KEYV)load();else login();setInterval(()=>{if(KEYV&&D&&document.visibilityState=='visible')load()},60000);
</script></body></html>
