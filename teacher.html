<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Teacher panel</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667;--ac:#4f46e5;--ok:#16a34a;--no:#dc2626;--wa:#d97706;--bd:#e3e5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1d2030;--tx:#eef0f8;--mu:#9aa0b8;--bd:#2c3046;--ac:#8b85ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#w{max-width:620px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
input,button{font:inherit}input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:6px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer}.mu{color:var(--mu);font-size:14px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.g div{text-align:center;background:var(--bg);border-radius:10px;padding:8px}.g b{display:block;font-size:20px}.g span{font-size:12px;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.fl{background:rgba(217,119,6,.14);color:var(--wa);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 3px;text-align:right;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}
ul{margin:4px 0 8px;padding-left:20px}li{margin:3px 0}details{border-top:1px solid var(--bd);padding:6px 0}summary{cursor:pointer;font-weight:600}h3{margin:12px 0 4px;font-size:16px}
</style></head><body><div id="w"></div>
<script>
const W=document.getElementById('w'),esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEYV='';try{KEYV=sessionStorage.getItem('tk')||''}catch(e){}
const fm=s=>{s=Math.round(s/60);return s>=60?Math.floor(s/60)+'h '+(s%60)+'m':s+' min'};
const hm=ms=>{const d=new Date(ms+5.75*3600e3);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')};
const ago=(now,t)=>{if(!t)return'never';const m=Math.round((now-t)/60000);return m<2?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
const vl=v=>v&&v.length?'<ul>'+v.slice().sort((a,b)=>a.s-b.s).map(x=>'<li>'+hm(x.s)+' – '+hm(x.e)+' · <b>'+fm(x.secs)+'</b> active · '+x.qs+' questions'+(x.off?' · ⏱ synced later (was offline)':'')+'</li>').join('')+'</ul>':'<p class=mu>No visit details recorded for this day.</p>';
function login(msg){W.innerHTML='<div class=card><h2>👩‍🏫 Teacher panel</h2><p class=mu>Enter your teacher key.</p><input id=k type=password placeholder="Teacher key" autocomplete=current-password><button id=b style="width:100%">Open</button><p id=m style="color:var(--no)">'+esc(msg||'')+'</p></div>';
const go=()=>{KEYV=document.getElementById('k').value;try{sessionStorage.setItem('tk',KEYV)}catch(e){}load()};document.getElementById('b').onclick=go;document.getElementById('k').onkeydown=e=>{if(e.key=='Enter')go()}}
async function load(){try{const H={headers:{'x-teacher-key':KEYV}},[r,c]=await Promise.all([fetch('/api/teacher',H),fetch('/api/teacher?check=1',H).catch(()=>null)]);if(r.status==401){try{sessionStorage.removeItem('tk')}catch(e){}return login('Wrong key.')}if(!r.ok)throw 0;let chk=null;try{chk=c&&c.ok?await c.json():null}catch(e){}draw(await r.json(),chk)}catch(e){W.innerHTML='<div class=card>Could not load the data. Open <b>System check</b> by trying again; if it keeps failing, the database or keys are not set up in Vercel yet.<br><br><button onclick="load()">Try again</button></div>'}}
function sys(c){if(!c)return'<p class=mu>System check unavailable.</p>';const L=(ok,t)=>'<li>'+(ok?'✅':'❌')+' '+t+'</li>';return '<ul style="list-style:none;padding:0">'+L(c.env.TRACK_SECRET,'TRACK_SECRET is set')+L(c.env.APP_USERS,'APP_USERS is set ('+c.loginUsers+' student login'+(c.loginUsers==1?'':'s')+')')+L(c.env.REDIS_URL&&c.env.REDIS_TOKEN,'Database variables are set')+L(c.redis=='ok','Database connection: '+esc(c.redis))+L((c.recordedStudents||0)>0,'Students who have sent data: '+(c.recordedStudents==null?'unknown':c.recordedStudents))+'</ul>'}
function draw(D,chk){const ds=Object.keys(D.students.reduce((a,s)=>(Object.keys(s.days).forEach(d=>a[d]=1),a),{})).sort().slice(-7);
const vc=x=>x?Math.max(x.opens||0,(x.v||[]).length):0;
W.innerHTML='<h2>👩‍🏫 Teacher panel</h2><p class=mu>Today: '+esc(D.today)+' (Nepal time) · refreshes every minute · <a href=# id=r style="color:var(--ac)">refresh now</a></p>'+(D.students.length?D.students.map(s=>{const t=s.days[D.today]||{opens:0,secs:0,qs:0,rq:0,correct:0,es:0,fast:0},acc=t.qs?Math.round(100*t.correct/t.qs):null,on=D.now-s.seen<600000,fl=[];
const total=Object.values(s.days).reduce((n,x)=>n+vc(x),0);
if(!t.qs&&!t.secs)fl.push('No activity today.');if(t.secs>=1200&&t.qs<5)fl.push('Time spent ('+fm(t.secs)+') but only '+t.qs+' questions answered.');if(t.qs>=8&&t.fast/(t.qs+t.rq)>.25)fl.push(t.fast+' answers were given in under 2 seconds (possible random tapping).');if(t.qs>=15&&acc<30)fl.push('Very low accuracy ('+acc+'%).');
return '<div class=card><b style="font-size:18px"><span class=dot style="background:'+(on?'var(--ok)':'var(--mu)')+'"></span>'+esc(s.u)+'</b> <span class=mu>· last seen '+ago(D.now,s.seen)+'</span><div class=g><div><b>'+vc(t)+'</b><span>Visits today</span></div><div><b>'+fm(t.secs)+'</b><span>Time spent</span></div><div><b>'+t.qs+'</b><span>Questions</span></div><div><b>'+(acc==null?'–':acc+'%')+'</b><span>Correct</span></div><div><b>'+total+'</b><span>Total visits</span></div><div><b>'+t.es+'</b><span>Essays</span></div></div>'+fl.map(x=>'<div class=fl>⚠️ '+esc(x)+'</div>').join('')+
'<h3>Today\'s visits</h3>'+vl(t.v)+'<h3>Earlier days</h3>'+(ds.filter(d=>d!==D.today).reverse().map(d=>{const x=s.days[d]||{};return '<details><summary>'+esc(d.slice(5))+' · '+vc(x)+' visit'+(vc(x)==1?'':'s')+' · '+fm(x.secs||0)+' · '+(x.qs||0)+' questions</summary>'+vl(x.v)+'</details>'}).join('')||'<p class=mu>No earlier days yet.</p>')+
'<p class=mu>XP '+s.snap.xp+' · streak '+s.snap.streak+' · stars '+s.snap.stars+' · words mastered '+s.snap.words+'<br>Weak spots: '+(s.snap.miss.length?s.snap.miss.map(m=>esc(m[0])+' ×'+m[1]).join(', '):'none yet')+'</p></div>'}).join(''):'<div class=card><b>No student activity recorded yet.</b><p class=mu>Common reasons: the student has not logged out and in again since the update, or a setting below is missing.</p></div>')+
'<details class=card'+(D.students.length?'':' open')+'><summary>System check</summary>'+sys(chk)+'</details><p class=mu>Counts and times only. Answers are never stored. Visits use Nepal time; a new visit starts after 30 minutes without activity.</p>';
const rf=document.getElementById('r');if(rf)rf.onclick=e=>{e.preventDefault();load()}}
if(KEYV)load();else login();setInterval(()=>{if(KEYV&&document.visibilityState=='visible')load()},60000);
</script></body></html>
