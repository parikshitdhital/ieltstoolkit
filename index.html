const PT="Info Hunter passage";
const INFO=`<p class=ctx><b>A</b> In 2010, a group in Detroit turned empty lots into vegetable gardens. Within five years, over 1,400 such gardens were feeding local families.<br><b>B</b> Gardens also bring neighbours together. Residents who once never spoke now share tools and recipes.<br><b>C</b> Yet there are problems. Soil in old industrial areas can contain lead, so it must be tested before anything is planted.<br><b>D</b> Experts suggest that cities should offer free soil testing and cheap land to gardeners.</p>`;

const D={
gist:{t:"Main Idea",e:"🎯",d:"Pick the best heading (Matching Headings)",items:[
{ctx:"Many cities are building more bike lanes. Cyclists once shared narrow roads with cars, and accidents were common. Now protected lanes keep riders apart from traffic, and studies show injuries have fallen sharply.",o:["Protected lanes make cycling safer","Accidents between bikes and cars","Why cars are better than bikes"],c:0,tg:["","Too narrow (only a detail)","Opposite / off-topic"],why:"Accidents are only the background. The whole paragraph is about lanes making riders safer.",n:"सुरक्षित बाइक लेनले साइकल सुरक्षित बनाउँछ — यही मुख्य कुरा हो। दुर्घटना केवल एउटा विवरण हो।"},
{ctx:"Early experts believed sleep was a passive state in which the brain simply switched off. However, brain scans in the 1950s revealed intense activity during some sleep stages. Today, scientists see sleep as an active process that is vital for memory.",o:["A changed view of what the brain does in sleep","Sleep is a passive state","The brain scans of the 1950s"],c:0,tg:["","First-sentence trap (old belief)","Too narrow (only a detail)"],why:"The first sentence gives an old idea. After 'However' comes the real point: the view changed.",n:"'However' पछि लेखकको असली कुरा आउँछ: निद्राबारे सोच बदलियो।"},
{ctx:"Coffee first became popular in Arabia. Traders carried it to Europe in the 1600s, where coffee houses opened in London and Paris. These houses became places where people discussed news and ideas.",o:["How coffee spread and became a social habit","Coffee houses in London","Why coffee is good for health"],c:0,tg:["","Too narrow (only a detail)","Not mentioned"],why:"The paragraph follows coffee from Arabia to Europe to social life. 'Health' is never mentioned.",n:"कफी कसरी फैलियो र सामाजिक बानी बन्यो — पूरा अनुच्छेदले यही भन्छ।"},
{ctx:"Some farmers use drones to check crops. A drone can fly over a field in minutes, a job that once took days on foot. It spots dry areas early, so water can be sent exactly where needed. However, drones are costly, and small farms often cannot afford them.",o:["Drones help farmers, but cost limits their use","The high price of drones","How farmers used to walk their fields"],c:0,tg:["","Too narrow (only the last part)","Too narrow (only a detail)"],why:"Both the benefits and the cost problem appear. The best heading covers the whole paragraph.",n:"ड्रोन उपयोगी छ तर महँगो छ — दुवै कुरा समेट्ने शीर्षक चाहिन्छ।"}]},
para:{t:"Paraphrase Lab",e:"🔁",d:"How did the sentence change?",items:[
"Prices increased sharply.|There was a steep rise in prices.|Word form|Word form (increase → rise)|वृद्धि हुनु (increase) → rise: क्रिया नाम बन्यो।",

ip("a recommendation for city governments",3,"D: 'Experts suggest that cities should…' = a recommendation.","D मा 'suggest … should' = सुझाव।"),
ip("an example of a social benefit",1,"B: neighbours sharing tools and recipes = social benefit.","B मा छिमेकीहरू औजार र रेसिपी बाँड्छन् — सामाजिक फाइदा।"),
ip("a figure showing how widespread the idea became",0,"A: 'over 1,400 gardens' = the figure. Numbers are easy anchors.","A मा 'over 1,400' — संख्या सबैभन्दा सजिलो संकेत हो।")]},
sig:{t:"Signal Words",e:"🚦",d:"What does the signal word show?",items:[
"Many people believe tea is healthier; <b>however</b>, studies show little difference.|Contrast|After a contrast word, the writer's real point comes: studies show little difference.|Contrast शब्द पछि लेखकको असली कुरा आउँछ।",
"<b>Because</b> the river flooded, the town lost its bridge.|Cause|'Because' introduces the reason (the flood).|'Because' ले कारण देखाउँछ।",
"Some birds, <b>such as</b> crows, can use tools.|Example|'Such as' introduces an example.|'Such as' ले उदाहरण दिन्छ।",
"Rents rose; <b>as a result</b>, many families moved away.|Result|'As a result' introduces the effect.|'As a result' ले परिणाम देखाउँछ।",
"<b>Although</b> the test was hard, most students passed.|Contrast|'Although' shows contrast: hard, but passed. The main point is that they passed.|'Although' = विपरीत; मुख्य कुरा: धेरैले पास गरे।"].map(s=>{let[q,c,w,n]=s.split("|"),ty=["Contrast","Cause","Example","Result"];return{q:q,o:ty,c:ty.indexOf(c),fx:1,tg:ty.map(()=>"Signal word"),why:w,n}})}

<div class=stats><div><b>${lv()}</b><span>Level</span></div><div><b>${S.xp}</b><span>XP</span></div><div><b>🔥${S.streak}</b><span>Day streak</span></div></div>
<p class=mu>5 questions per round. Do one round of each mode daily.</p>`+Object.keys(D).map(k=>{let a=S.acc[k]||[0,0];return`<button class=mode data-m=${k}><b>${D[k].e} ${D[k].t}</b><small>${D[k].d}${a[1]?` · ${Math.round(100*a[0]/a[1])}% correct`:""}</small></button>`}).join("")+
`<div class=card><b>Weak spots</b><br>${w.length?w.map(x=>`<span class=tag>${x[0]} ×${x[1]}</span>`).join(""):'<span class=mu>No mistakes logged yet.</span>'}</div><button class="btn ghost" id=rs>Reset progress</button>`;

$('#rs').onclick=()=>{if(confirm("Reset all progress?")){S={xp:0,streak:0,last:'',acc:{},miss:{}};save();home()}}}
function run(m,its,i,ok){if(i>=its.length)return end(m,ok,its.length);
let it=its[i],ix=it.o.map((_,k)=>k);if(!it.fx)ix=shuf(ix);
A.innerHTML=`<div class=row><button class="ghost btn" style="width:auto;margin:0;padding:6px 12px" id=bk>←</button><span class=mu>${D[m].t} · ${i+1}/${its.length}</span></div><div class=bar style="margin:10px 0"><i style="width:${100*i/its.length}%"></i></div>
<div class=card>${it.ctx?`<div class=ctx>${it.ctx.replace(/^<p class=ctx>|<\/p>$/g,"")}</div><br>`:""}<b>${it.q||"Which heading fits best?"}</b></div>`+ix.map(k=>`<button class=opt data-k=${k}>${it.o[k]}</button>`).join("")+`<div id=fb></div>`;
$('#bk').onclick=home;let done=0;
A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=1;let k=+b.dataset.k,good=k==it.c;
A.querySelectorAll('.opt').forEach(o=>{if(+o.dataset.k==it.c)o.classList.add('ok')});
if(!good){b.classList.add('no');let t=it.tg[k];if(t)S.miss[t]=(S.miss[t]||0)+1}
S.xp+=good?10:2;S.acc[m]=S.acc[m]||[0,0];S.acc[m][0]+=good?1:0;S.acc[m][1]++;save();
$('#fb').innerHTML=`<div class=card><b>${good?"✅ Correct! +10 XP":"❌ Not quite. +2 XP"}</b>${good?"":`<br><span class=tag>${it.tg[k]}</span>`}<p>${it.why}</p><button class="btn ghost" id=npb>नेपाली</button><div class=np id=np hidden>${it.n}</div></div><button class=btn id=nx>${i+1<its.length?"Next":"Finish"}</button>`;
$('#npb').onclick=()=>{$('#np').hidden=!$('#np').hidden};$('#nx').onclick=()=>run(m,its,i+1,ok+(good?1:0));$('#nx').scrollIntoView({behavior:"smooth",block:"end"})})}
function end(m,ok,n){let t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
if(S.last!=t){S.streak=S.last==y?S.streak+1:1;S.last=t;S.xp+=20}save();
A.innerHTML=`<div class=card style="text-align:center"><h2>Round done! 🎉</h2><p style="font-size:32px;margin:6px">${ok}/${n}</p><p class=mu>${ok==n?"Perfect score!":ok>=3?"Good work. Review the red tags on the home screen.":"Keep going. Mistakes are how you learn."}</p><p>Level ${lv()} · ${S.xp} XP · 🔥${S.streak}</p></div><button class=btn id=ag>Play again</button><button class="btn ghost" id=hm>Home</button>`;
$('#ag').onclick=()=>run(m,shuf(D[m].items).slice(0,5),0,0);$('#hm').onclick=home}

const GN="मुख्य विचार छान्नुहोस् — एउटा विवरण होइन, पूरा अनुच्छेदले भन्ने कुरा।";
`Bees visit flowers to collect nectar. In doing so, they carry pollen from plant to plant, so many crops can produce fruit. Without bees, farmers would struggle to grow apples, almonds and other foods.|Bees are essential for food crops|Off-topic|How bees make honey|Detail trap|Apples and almonds|Honey and apples are details. The point: crops depend on bees.
For decades, people assumed older adults could not learn new skills easily. Recent studies, however, show that seniors who take music or language classes improve their memory. Learning at any age keeps the brain active.|Older people can still learn and benefit|First-sentence trap|The belief that seniors cannot learn|Detail trap|Music classes for seniors|The first sentence is the old belief. 'However' leads to the real point.
Plastic waste is a growing problem in oceans. Turtles mistake bags for jellyfish, and seabirds feed plastic pieces to their chicks. Scientists estimate millions of animals are harmed each year.|The harm plastic causes to sea animals|Too narrow|How turtles hunt jellyfish|Off-topic|Why plastic is cheap to make|Turtles are one example. The whole paragraph is about harm to animals.
Remote work became common after 2020. Employees save hours of travel and report better balance between work and family. Yet some managers worry that teams communicate less and new staff learn more slowly.|Remote work: benefits and concerns|Too narrow|Time saved on travel|Too narrow|Managers' worries|Both benefits and worries appear. Choose the heading that covers both.
The first public libraries were open only to wealthy readers. In the nineteenth century, reformers argued that books should be free for everyone. Over time, many countries passed laws to fund libraries from taxes.|How libraries became open to all|First-sentence trap|Libraries for wealthy readers|Detail trap|Taxes in the nineteenth century|The paragraph tells a change over time, not just the starting point.
Mountain glaciers are shrinking fast. Rivers fed by melting ice may flood now but dry up later, threatening farms and cities downstream. Planners in several countries are already preparing.|Shrinking glaciers threaten future water supply|Too narrow|Floods in mountain rivers|Off-topic|Why glaciers are beautiful|Flooding is only the short-term part. The main point is the later water risk.
Many people think fast food is the main cause of obesity. Researchers point out that inactive lifestyles and sugary drinks also play major roles. The problem, they say, has several causes, not one.|Obesity has multiple causes|First-sentence trap|Fast food as the main cause|Too narrow|Sugary drinks|The first sentence gives a common belief that the paragraph corrects.
Electric cars produce no exhaust gases while driving. But making their batteries requires mining metals, which damages land and uses much energy. Their true environmental cost is therefore debated.|The environmental impact of electric cars is debated|Too narrow|No exhaust from electric cars|Too narrow|Mining of metals|The word 'But' shows two sides. The conclusion is that the cost is debated.
Tea was discovered in China, according to legend, when leaves blew into an emperor's boiling water. Over centuries it became a national drink and later an important export. By the 1800s, tea trade shaped several economies.|The history and growing importance of tea|Detail trap|The legend of the emperor|Too narrow|Tea trade in the 1800s|The paragraph covers a long history. The legend is only the start.
Many students believe that rereading a text is the best way to remember it. Psychologists have found that testing yourself is far more effective. Recalling facts without looking strengthens memory in a way rereading does not.|Self-testing works better than rereading|First-sentence trap|Rereading is the best method|Detail trap|Psychologists' studies|Sentence 1 is the common belief. Sentences 2-3 give the real point.

The invention of the printing press in the 1400s made books cheaper. More people learned to read, ideas travelled faster, and new scientific theories spread across Europe within years rather than decades.|How printing changed the spread of knowledge|Detail trap|The price of books|Too narrow|Scientific theories only|Cheap books are the start. The main idea is faster spread of knowledge.`.split("\n").forEach(l=>{let[p,a,t1,b,t2,c,w]=l.split("|");D.gist.items.push({ctx:p,q:"Best heading for this paragraph?",o:[a,b,c],c:0,tg:["",t1,t2],why:w,n:GN})});
